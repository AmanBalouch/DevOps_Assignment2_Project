version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: rentease-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: rentease
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: durmuhammad/rentease-backend:v1.0
    container_name: rentease-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/rentease
      SECRET_KEY: your-secret-key-change-this-in-production
      CORS_ORIGINS: '["http://localhost:80", "http://localhost:8000", "http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    image: durmuhammad/rentease-frontend:v1.0
    container_name: rentease-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
